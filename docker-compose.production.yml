services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codesmell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: codesmell
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesmell -d codesmell"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    image: codesmell:0.7.0
    command: ["db", "upgrade"]
    environment: &app_env
      CODESMELL_ENVIRONMENT: production
      CODESMELL_DATABASE__URL: postgresql+psycopg://codesmell:${POSTGRES_PASSWORD}@db:5432/codesmell
      CODESMELL_DATABASE__AUTO_MIGRATE: "false"
      CODESMELL_WORKSPACE_ROOT: /var/lib/codesmell/workspaces
      CODESMELL_API__STORAGE_ROOT: /var/lib/codesmell/data
      CODESMELL_SECURITY__AUTH_ENABLED: "true"
      CODESMELL_SECURITY__JWT_SECRET: ${CODESMELL_JWT_SECRET:?set CODESMELL_JWT_SECRET}
      CODESMELL_SECURITY__BOOTSTRAP_ADMIN_EMAIL: ${CODESMELL_ADMIN_EMAIL:-}
      CODESMELL_SECURITY__BOOTSTRAP_ADMIN_PASSWORD: ${CODESMELL_ADMIN_PASSWORD:-}
      CODESMELL_SECURITY__BOOTSTRAP_ADMIN_NAME: ${CODESMELL_ADMIN_NAME:-CodeSmell Administrator}
      CODESMELL_SECURITY__DOCS_ENABLED: "false"
      CODESMELL_SECURITY__TRUSTED_HOSTS: '["api","frontend","localhost","${CODESMELL_DOMAIN}"]'
      CODESMELL_SECURITY__FORCE_HTTPS: "false"
      CODESMELL_LOGGING__JSON_OUTPUT: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: codesmell:0.7.0
    command: ["api", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app_env
    volumes:
      - codesmell_data:/var/lib/codesmell
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  worker:
    image: codesmell:0.7.0
    command: ["worker", "run", "--no-migrate"]
    environment: *app_env
    volumes:
      - codesmell_data:/var/lib/codesmell
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: codesmell-frontend:0.7.0
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  gateway:
    image: caddy:2.8-alpine
    environment:
      CODESMELL_DOMAIN: ${CODESMELL_DOMAIN:?set CODESMELL_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: ["pg_dump -h db -U codesmell -Fc codesmell > /backups/codesmell-$$(date +%Y%m%d-%H%M%S).dump"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  codesmell_data:
  caddy_data:
  caddy_config:

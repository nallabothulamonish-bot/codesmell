[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesmell"
version = "0.7.0"
description = "Explainable and cross-project code smell detection using software metrics"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.4,<2.0",
    "joblib>=1.3",
    "numpy>=1.26,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyJWT>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "reportlab>=4.2,<5.0",
    "matplotlib>=3.9,<4.0",
]

[project.optional-dependencies]
shap = [
    "shap>=0.47,<1.0",
    "numba>=0.59.0",
    "llvmlite>=0.42.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "httpx>=0.28,<1.0",
]

[project.scripts]
codesmell = "codesmell.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"codesmell.detectors" = ["default_rules.yaml"]
"codesmell.db.migrations" = ["script.py.mako", "versions/*.py"]

[tool.vercel]
entrypoint = "src.codesmell.api.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/codesmell"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["codesmell"]
warn_unreachable = true
